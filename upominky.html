<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upomínka neplatičům — Nástroje pro dodávkáře</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @media print {
      body * { visibility: hidden; }
      #u-print-area, #u-print-area * { visibility: visible; }
      #u-print-area { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; padding: 32px !important; border: none !important; }
      #u-out { background: white !important; color: black !important; border: 1px solid #000 !important; font-size: 14px !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-8 pb-20 flex-1 w-full">

    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Předžalobní upomínka neplatičům (+40 €)</h1>
      <p class="text-base text-zinc-300 mt-1">
        Spedice neplatí po splatnosti? Zadej 3 údaje a zkopíruj hotovou výzvu do e-mailu nebo ji vytiskni do PDF.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

      <div class="lg:col-span-5 trukon-card rounded-3xl p-6 space-y-4">
        <div>
          <label class="block text-sm text-zinc-300 mb-1">Jazyk výzvy</label>
          <select id="u-lang" onchange="genLetter()" class="w-full bg-[#141518] border border-white/15 rounded-xl px-4 py-3 text-sm text-white font-semibold">
            <option value="de">🇩🇪 Němčina (Letzte Mahnung)</option>
            <option value="en">🇬🇧 Angličtina (Final Notice)</option>
            <option value="cz">🇨🇿 Čeština (Předžalobní výzva)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-zinc-300 mb-1">1. Název dlužné spedice</label>
          <input type="text" id="u-deb" value="Cargo Express GmbH" oninput="genLetter()" class="w-full bg-[#141518] border border-white/15 rounded-xl px-4 py-2.5 text-base text-white font-semibold">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm text-zinc-300 mb-1">2. Číslo faktury</label>
            <input type="text" id="u-inv" value="2026048" oninput="genLetter()" class="w-full bg-[#141518] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white font-bold">
          </div>
          <div>
            <label class="block text-sm text-zinc-300 mb-1">Dní po splatnosti</label>
            <input type="number" id="u-days" value="18" oninput="genLetter()" class="w-full bg-[#141518] border border-white/15 rounded-xl px-3.5 py-2.5 text-base text-white font-bold">
          </div>
        </div>
        <div>
          <label class="block text-sm text-zinc-300 mb-1">3. Dlužná částka (EUR)</label>
          <input type="number" id="u-amt" value="1150" oninput="genLetter()" class="w-full bg-[#141518] border border-white/15 rounded-xl px-4 py-2.5 text-lg font-extrabold text-orange-300">
        </div>

        <div class="space-y-2.5 pt-2">
          <button onclick="copyLetter()" id="btn-copy" class="w-full trukon-btn text-base py-3.5 rounded-xl transition">
            📋 Zkopírovat text do e-mailu
          </button>
          <button onclick="window.print()" class="w-full bg-[#141518] hover:bg-zinc-800 border border-white/15 text-white font-semibold text-sm py-3 rounded-xl transition">
            🖨️ Uložit jako PDF přílohu
          </button>
        </div>
      </div>

      <div class="lg:col-span-7">
        <div id="u-print-area" class="trukon-card-subtle rounded-3xl p-6">
          <pre id="u-out" class="whitespace-pre-wrap text-sm sm:text-base text-zinc-100 leading-relaxed bg-[#141518] border border-white/10 rounded-2xl p-5"></pre>
        </div>
      </div>

    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    window.APP.mountHeader(false);

    const params = new URLSearchParams(location.search);
    if (params.get("deb")) document.getElementById("u-deb").value = params.get("deb");
    if (params.get("amt")) document.getElementById("u-amt").value = params.get("amt");

    function genLetter() {
      const lang = document.getElementById("u-lang").value;
      const deb = document.getElementById("u-deb").value.trim();
      const inv = document.getElementById("u-inv").value.trim();
      const amt = Number(document.getElementById("u-amt").value) || 0;
      const days = Number(document.getElementById("u-days").value) || 0;
      const total = amt + 40;

      const templates = {
        de: `BETREFF: LETZTE MAHNUNG VOR RECHTSMITTELN – Rechnung Nr. ${inv}\n\nSehr geehrte Damen und Herren (${deb}),\n\ntrotz Fälligkeit ist unsere Frachtrechnung Nr. ${inv} über ${amt} EUR seit ${days} Tagen unbezahlt.\n\nGemäß EU-Zahlungsverzugsrichtlinie 2011/7/EU berechnen wir hiermit die gesetzliche Verzugspauschale von 40,00 EUR zzgl. Verzugszinsen. Gesamtforderung: ${total} EUR.\n\nSollte der Gesamtbetrag nicht innerhalb von 5 Werktagen auf unserem Konto eingehen, übergeben wir die Forderung ohne weitere Ankündigung an unser Inkassobüro / unsere Rechtsvertretung sowie zur Meldung an das Mahnwesen der Frachtenbörsen.`,
        en: `SUBJECT: FINAL PAYMENT DEMAND BEFORE LEGAL ACTION – Invoice No. ${inv}\n\nDear ${deb},\n\nDespite reaching maturity, our transport invoice No. ${inv} for ${amt} EUR is now ${days} days overdue.\n\nIn accordance with EU Late Payment Directive 2011/7/EU, we hereby add the statutory recovery fee of 40.00 EUR plus statutory late payment interest. Total due immediately: ${total} EUR.\n\nIf full payment is not received within 5 business days, we will hand the claim over to debt collection / legal counsel and initiate a European Payment Order without further notice.`,
        cz: `PŘEDMĚT: PŘEDŽALOBNÍ VÝZVA K ÚHRADĚ (§ 142a OSŘ) – Faktura č. ${inv}\n\nVážení (${deb}),\n\nevidujeme u Vás neuhrazenou fakturu za přepravu č. ${inv} ve výši ${amt} EUR, která je již ${days} dní po splatnosti.\n\nV souladu se směrnicí EU č. 2011/7/EU a § 3 nařízení vlády č. 351/2013 Sb. uplatňujeme paušální náhradu nákladů spojených s uplatněním pohledávky ve výši 40 EUR (1 200 Kč) a zákonný úrok z prodlení. Celkem k okamžité úhradě: ${total} EUR.\n\nNebude-li částka připsána na náš účet do 5 pracovních dnů, předáme pohledávku k inkasnímu a právnímu vymáhání včetně hlášení prodlení v databázích přepravních burz.`
      };

      document.getElementById("u-out").textContent = templates[lang];
    }

    function copyLetter() {
      navigator.clipboard.writeText(document.getElementById("u-out").textContent);
      const b = document.getElementById("btn-copy");
      b.textContent = "✓ Zkopírováno do schránky";
      setTimeout(() => b.textContent = "📋 Zkopírovat text do e-mailu", 2500);
    }

    genLetter();
  </script>
</body>
</html>
